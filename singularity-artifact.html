<title>SINGULARITY</title>
<style>
  :root{
    --bg0:#07040f; --bg1:#120726; --cyan:#38f9e4; --mag:#ff3ca6; --violet:#8a4dff;
    --gold:#ffd166; --white:#f4f0ff; --dim:#8a7fb5;
    --display: ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', Menlo, Consolas, monospace;
    --body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-family: var(--body);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;overscroll-behavior:none;}
  body{
    background:radial-gradient(120% 90% at 50% 0%, #1b0a3a 0%, var(--bg1) 40%, var(--bg0) 100%);
    color:var(--white);position:fixed;inset:0;width:100%;height:100%;overflow:hidden;
    display:flex;align-items:center;justify-content:center;touch-action:none;
  }
  #wrap{position:relative;width:100%;height:100%;}
  #scene{display:block;width:100%;height:100%;touch-action:none;cursor:pointer;}

  .hud{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;
    align-items:flex-start;pointer-events:none;z-index:5;font-family:var(--display);}
  .hud .stack{display:flex;flex-direction:column;gap:2px;}
  .hud .k{font-size:10px;letter-spacing:3px;color:var(--dim);font-weight:700;}
  .hud .v{font-size:clamp(24px,7vw,34px);font-weight:900;line-height:1;
    text-shadow:0 0 14px rgba(56,249,228,.5);font-variant-numeric:tabular-nums;}
  .hud .right{text-align:right;}
  .hud .right .v{color:var(--mag);text-shadow:0 0 14px rgba(255,60,166,.5);}
  #multi{font-family:var(--display);position:absolute;top:64px;left:50%;transform:translateX(-50%);
    font-size:clamp(16px,5vw,22px);font-weight:900;letter-spacing:1px;z-index:5;pointer-events:none;
    color:var(--gold);text-shadow:0 0 16px rgba(255,209,102,.7);opacity:0;transition:opacity .2s;}
  #multi.on{opacity:1;}

  .panel{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:24px;
    background:radial-gradient(80% 60% at 50% 40%, rgba(18,7,38,.35), rgba(7,4,15,.82));
    backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:opacity .35s;}
  .panel.show{opacity:1;visibility:visible;}
  .logo{font-family:var(--display);font-weight:900;font-size:clamp(34px,12vw,72px);letter-spacing:6px;
    margin:0;line-height:.92;
    background:linear-gradient(180deg,#fff,var(--cyan) 55%,var(--violet));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(56,249,228,.45));}
  .logo .dot{color:var(--mag);-webkit-text-fill-color:var(--mag);}
  .tag{font-size:clamp(12px,3.4vw,15px);letter-spacing:4px;color:var(--dim);
    text-transform:uppercase;margin:10px 0 0;font-weight:600;font-family:var(--display);}
  .how{max-width:340px;margin:26px auto 0;color:#c8bff0;font-size:clamp(14px,4vw,17px);line-height:1.55;font-weight:500;}
  .how b{color:var(--cyan);font-weight:700;}
  .how .m{color:var(--mag);font-weight:700;}
  .btn{margin-top:30px;font-family:var(--display);font-weight:700;letter-spacing:3px;font-size:15px;
    color:#08040f;background:linear-gradient(180deg,var(--cyan),#12c6b8);border:none;border-radius:40px;
    padding:16px 40px;cursor:pointer;pointer-events:auto;
    box-shadow:0 0 28px rgba(56,249,228,.55), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .12s, box-shadow .2s;}
  .btn:active{transform:scale(.95);}
  .btn:focus-visible{outline:3px solid var(--white);outline-offset:3px;}
  .btn.pulse{animation:bpulse 1.6s ease-in-out infinite;}
  @keyframes bpulse{0%,100%{box-shadow:0 0 22px rgba(56,249,228,.45)}50%{box-shadow:0 0 40px rgba(56,249,228,.85)}}
  .go-title{font-family:var(--display);font-weight:900;font-size:clamp(28px,9vw,52px);letter-spacing:4px;margin:0;
    color:var(--mag);text-shadow:0 0 24px rgba(255,60,166,.6);}
  .scores{display:flex;gap:34px;margin-top:22px;font-family:var(--display);}
  .scores .col .k{font-size:11px;letter-spacing:3px;color:var(--dim);font-weight:700;}
  .scores .col .n{font-size:clamp(30px,9vw,44px);font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums;}
  .scores .best .n{color:var(--gold);text-shadow:0 0 16px rgba(255,209,102,.5);}
  .newbest{margin-top:14px;color:var(--gold);font-family:var(--display);font-weight:700;letter-spacing:2px;
    font-size:14px;opacity:0;}
  .newbest.on{opacity:1;animation:nb .9s ease infinite alternate;}
  @keyframes nb{from{filter:drop-shadow(0 0 2px rgba(255,209,102,.4))}to{filter:drop-shadow(0 0 14px rgba(255,209,102,.9))}}
  .hint{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:var(--dim);
    font-size:12px;letter-spacing:2px;z-index:5;pointer-events:none;font-weight:700;text-transform:uppercase;
    font-family:var(--display);}
  @media (max-width:380px){.scores{gap:22px;}}
  @media (prefers-reduced-motion: reduce){
    .btn.pulse,.newbest.on{animation:none;}
  }
</style>

<div id="wrap">
  <canvas id="scene"></canvas>

  <div class="hud">
    <div class="stack"><span class="k">SCORE</span><span class="v" id="score">0</span></div>
    <div class="stack right"><span class="k">BEST</span><span class="v" id="best">0</span></div>
  </div>
  <div id="multi">×1</div>
  <div class="hint" id="hint"></div>

  <div class="panel show" id="startPanel">
    <h1 class="logo">SINGULA<span class="dot">R</span>ITY</h1>
    <p class="tag">One thumb · One orbit</p>
    <p class="how">
      You're trapped in orbit around a collapsing star.<br>
      <b>Tap / click / space</b> to <b>flip</b> your orbit direction.<br>
      Sweep up <span class="m">energy</span> · dodge the incoming <b>shards</b>.<br>
      One hit and the singularity takes you.
    </p>
    <button class="btn pulse" id="startBtn">ENTER ORBIT</button>
  </div>

  <div class="panel" id="overPanel">
    <h2 class="go-title">COLLAPSED</h2>
    <div class="scores">
      <div class="col"><div class="k">SCORE</div><div class="n" id="finalScore">0</div></div>
      <div class="col best"><div class="k">BEST</div><div class="n" id="finalBest">0</div></div>
    </div>
    <div class="newbest" id="newBest">◆ NEW RECORD ◆</div>
    <button class="btn" id="againBtn">RE-ENTER</button>
  </div>
</div>

<script>
(() => {
"use strict";

const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl  = document.getElementById('best');
const multiEl = document.getElementById('multi');
const hintEl  = document.getElementById('hint');
const startPanel = document.getElementById('startPanel');
const overPanel  = document.getElementById('overPanel');

let W=0,H=0,CX=0,CY=0,DPR=1,R=0;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth || window.innerWidth;
  H = cv.clientHeight || window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX=W/2; CY=H/2; R=Math.min(W,H)*0.32;
}
window.addEventListener('resize', resize);

const BEST_KEY='singularity_best_v1';
let best=0;
try{ best=parseInt(localStorage.getItem(BEST_KEY)||'0',10)||0; }catch(e){}
bestEl.textContent=best;

const S={MENU:0,PLAY:1,OVER:2};
let state=S.MENU;
let player, shards=[], orbs=[], particles=[], stars=[], ripples=[];
let score=0, displayScore=0, combo=0, multiplier=1, time=0, spawnT=0, orbT=0;
let shake=0, coreAng=0, corePulse=0, lastTs=0, multiTimer=0;

const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function angDiff(a,b){let d=(a-b)%TAU;if(d<-Math.PI)d+=TAU;if(d>Math.PI)d-=TAU;return d;}

function makeStars(){
  stars=[];
  const n=Math.round((W*H)/9000);
  for(let i=0;i<n;i++) stars.push({x:Math.random()*W,y:Math.random()*H,z:rand(.2,1),tw:Math.random()*TAU});
}
resize(); makeStars();
window.addEventListener('resize', makeStars);

let AC=null;
function audio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function beep(freq,dur,type,vol,slideTo){
  const ac=audio(); if(!ac) return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime+dur);
  g.gain.setValueAtTime(0.0001, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(vol||0.15, ac.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime+dur+0.02);
}
const sFlip=()=>beep(rand(300,340),.08,'triangle',.10,200);
const sOrb=(n)=>beep(420+Math.min(n,10)*55,.12,'sine',.16,720+Math.min(n,10)*60);
const sHit=()=>{beep(160,.5,'sawtooth',.22,40);beep(90,.6,'sine',.18,30);};
const sStart=()=>beep(220,.25,'sine',.14,660);

function reset(){
  player={ang:-Math.PI/2,dir:1,spd:1.7};
  shards=[];orbs=[];particles=[];ripples=[];
  score=0;displayScore=0;combo=0;multiplier=1;time=0;spawnT=.8;orbT=.5;shake=0;corePulse=0;
  updHUD();
}
function startGame(){
  reset(); state=S.PLAY;
  startPanel.classList.remove('show'); overPanel.classList.remove('show');
  hintEl.textContent='TAP TO FLIP'; sStart();
}
function gameOver(){
  state=S.OVER; shake=26; sHit();
  burst(CX+Math.cos(player.ang)*R, CY+Math.sin(player.ang)*R, 46, ['#38f9e4','#ff3ca6','#fff']);
  ripples.push({r:R,a:1,w:6,c:'255,60,166'});
  const final=Math.floor(score);
  document.getElementById('finalScore').textContent=final;
  const nb=document.getElementById('newBest');
  if(final>best){ best=final; try{localStorage.setItem(BEST_KEY,String(best));}catch(e){} nb.classList.add('on'); }
  else nb.classList.remove('on');
  bestEl.textContent=best;
  document.getElementById('finalBest').textContent=best;
  hintEl.textContent='';
  setTimeout(()=>overPanel.classList.add('show'),650);
}
function flip(){
  if(state!==S.PLAY) return;
  player.dir*=-1; sFlip();
  burst(CX+Math.cos(player.ang)*R, CY+Math.sin(player.ang)*R, 8, ['#38f9e4','#8a4dff']);
}
function onTap(e){ if(e) e.preventDefault(); audio(); if(state===S.PLAY) flip(); }
cv.addEventListener('pointerdown', onTap, {passive:false});
window.addEventListener('keydown',(e)=>{
  if(e.code==='Space'||e.code==='ArrowUp'){
    e.preventDefault();
    if(state===S.PLAY) flip(); else startGame();
  }
});
document.getElementById('startBtn').addEventListener('click',(e)=>{e.stopPropagation();audio();startGame();});
document.getElementById('againBtn').addEventListener('click',(e)=>{e.stopPropagation();startGame();});

function spawnShard(){
  const ang=Math.random()*TAU;
  const speed=150+time*4.2+rand(-20,26);
  shards.push({ang,r:Math.max(W,H)*0.72,spd:speed,hit:false,telegraph:1});
}
function spawnOrb(){
  let a=player.ang+player.dir*rand(0.9,2.4)+rand(-0.3,0.3);
  orbs.push({ang:a,life:7.0,born:0,pop:0});
}
function burst(x,y,n,cols){
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU, sp=rand(40,260);
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(.4,.9),t:0,
      c:cols[(Math.random()*cols.length)|0],sz:rand(1.5,3.5)});
  }
}

function update(dt){
  time+=dt; coreAng+=dt*0.6; corePulse*=Math.pow(0.02,dt);
  if(shake>0) shake=Math.max(0,shake-dt*60);
  for(const s of stars) s.tw+=dt*2*s.z;
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.t+=dt;
    if(p.t>=p.life){particles.splice(i,1);continue;}
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.93; p.vy*=0.93;
  }
  for(let i=ripples.length-1;i>=0;i--){
    const r=ripples[i]; r.r+=dt*260; r.a-=dt*1.4;
    if(r.a<=0) ripples.splice(i,1);
  }
  if(state!==S.PLAY) return;

  player.spd=1.7+time*0.012;
  player.ang+=player.dir*player.spd*dt;

  const spawnEvery=clamp(1.25-time*0.012,0.42,1.25);
  spawnT-=dt; if(spawnT<=0){ spawnShard(); spawnT=spawnEvery*rand(0.75,1.2); }
  orbT-=dt; if(orbT<=0&&orbs.length<3){ spawnOrb(); orbT=rand(1.1,2.0); }

  const hitArc=0.30, ringBand=R*0.14;
  for(let i=shards.length-1;i>=0;i--){
    const sh=shards[i]; sh.r-=sh.spd*dt;
    if(sh.telegraph>0) sh.telegraph=Math.max(0,sh.telegraph-dt*0.9);
    if(!sh.hit && Math.abs(sh.r-R)<ringBand){
      if(Math.abs(angDiff(sh.ang,player.ang))<hitArc){ sh.hit=true; gameOver(); return; }
    }
    if(sh.r<=R*0.34){
      corePulse=Math.min(1,corePulse+0.35);
      burst(CX+Math.cos(sh.ang)*sh.r, CY+Math.sin(sh.ang)*sh.r, 5, ['#8a4dff','#ff3ca6']);
      shards.splice(i,1);
    }
  }
  for(let i=orbs.length-1;i>=0;i--){
    const o=orbs[i]; o.life-=dt; o.born=Math.min(1,o.born+dt*4);
    if(o.pop>0){ o.pop+=dt*4; if(o.pop>=1) orbs.splice(i,1); continue; }
    if(Math.abs(angDiff(o.ang,player.ang))<0.22){
      combo++; multiplier=1+Math.floor(combo/4); score+=10*multiplier; o.pop=0.001; sOrb(combo);
      burst(CX+Math.cos(o.ang)*R, CY+Math.sin(o.ang)*R, 14, ['#ffd166','#38f9e4','#fff']);
      ripples.push({r:R,a:.6,w:3,c:'255,209,102'});
      showMulti(); corePulse=Math.min(1,corePulse+0.15); continue;
    }
    if(o.life<=0){ combo=0; multiplier=1; showMulti(); orbs.splice(i,1); }
  }
  score+=dt*4; updHUD();
}
function showMulti(){
  multiEl.textContent='×'+multiplier;
  if(multiplier>1){ multiEl.classList.add('on'); multiTimer=1.1; }
  else multiEl.classList.remove('on');
}
function updHUD(){
  displayScore+=(score-displayScore)*0.25;
  scoreEl.textContent=Math.floor(displayScore);
}

function glow(color,blur){ ctx.shadowColor=color; ctx.shadowBlur=blur; }
function noGlow(){ ctx.shadowBlur=0; }

function draw(dt){
  let sx=0,sy=0;
  if(shake>0){ sx=rand(-shake,shake); sy=rand(-shake,shake); }
  ctx.save(); ctx.translate(sx,sy);
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(7,4,15,0.34)';
  ctx.fillRect(-40,-40,W+80,H+80);

  ctx.globalCompositeOperation='lighter';
  for(const s of stars){
    const a=0.25+0.55*(0.5+0.5*Math.sin(s.tw))*s.z;
    ctx.fillStyle=`rgba(180,170,255,${a})`;
    const sz=s.z*1.6; ctx.fillRect(s.x,s.y,sz,sz);
  }
  for(const r of ripples){
    ctx.strokeStyle=`rgba(${r.c},${clamp(r.a,0,1)})`;
    ctx.lineWidth=r.w; ctx.beginPath(); ctx.arc(CX,CY,r.r,0,TAU); ctx.stroke();
  }
  glow('rgba(138,77,255,.6)',18);
  ctx.strokeStyle='rgba(138,77,255,.42)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(CX,CY,R,0,TAU); ctx.stroke();
  noGlow();

  drawCore();

  for(const o of orbs){
    const ox=CX+Math.cos(o.ang)*R, oy=CY+Math.sin(o.ang)*R;
    const grow=o.pop>0?(1+o.pop*2):o.born;
    const fade=o.pop>0?(1-o.pop):(o.life<1.4?(0.4+0.6*(0.5+0.5*Math.sin(time*14))):1);
    const rad=8*grow;
    glow('#ffd166',22); ctx.globalAlpha=fade; ctx.fillStyle='#ffd166';
    ctx.beginPath(); ctx.arc(ox,oy,rad,0,TAU); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ox,oy,rad*0.4,0,TAU); ctx.fill();
    ctx.globalAlpha=1; noGlow();
  }
  for(const sh of shards){
    const x=CX+Math.cos(sh.ang)*sh.r, y=CY+Math.sin(sh.ang)*sh.r;
    if(sh.telegraph>0){
      ctx.strokeStyle=`rgba(255,60,166,${0.10*sh.telegraph})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(CX+Math.cos(sh.ang)*R,CY+Math.sin(sh.ang)*R); ctx.lineTo(x,y); ctx.stroke();
    }
    const dirx=-Math.cos(sh.ang), diry=-Math.sin(sh.ang);
    glow('#ff3ca6',16); ctx.strokeStyle='rgba(255,60,166,.55)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-dirx*20,y-diry*20); ctx.stroke();
    ctx.fillStyle='#ff6cc0'; ctx.beginPath(); ctx.arc(x,y,4.5,0,TAU); ctx.fill();
    noGlow();
  }
  if(state!==S.OVER){
    const px=CX+Math.cos(player.ang)*R, py=CY+Math.sin(player.ang)*R;
    const tang=player.ang+player.dir*Math.PI/2;
    ctx.save(); ctx.translate(px,py); ctx.rotate(tang);
    glow('#38f9e4',24); ctx.fillStyle='#38f9e4';
    ctx.beginPath(); ctx.moveTo(11,0); ctx.lineTo(-8,7); ctx.lineTo(-4,0); ctx.lineTo(-8,-7); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#eafffb'; ctx.beginPath(); ctx.arc(2,0,2.4,0,TAU); ctx.fill();
    ctx.restore(); noGlow();
  }
  for(const p of particles){
    const a=1-p.t/p.life; ctx.globalAlpha=a; ctx.fillStyle=p.c; glow(p.c,8);
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1; noGlow();
  ctx.globalCompositeOperation='source-over';
  ctx.restore();

  if(multiTimer>0){ multiTimer-=dt; if(multiTimer<=0&&multiplier<=1) multiEl.classList.remove('on'); }
}
function drawCore(){
  const baseR=R*0.28, pr=baseR*(1+corePulse*0.5);
  const g=ctx.createRadialGradient(CX,CY,pr*0.2,CX,CY,pr*2.4);
  g.addColorStop(0,'rgba(56,249,228,'+(0.5+corePulse*0.4)+')');
  g.addColorStop(0.35,'rgba(138,77,255,0.35)');
  g.addColorStop(1,'rgba(138,77,255,0)');
  ctx.globalCompositeOperation='lighter'; ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(CX,CY,pr*2.4,0,TAU); ctx.fill();
  ctx.save(); ctx.translate(CX,CY); ctx.rotate(coreAng);
  for(let i=0;i<3;i++){
    ctx.rotate(TAU/3);
    ctx.strokeStyle='rgba(56,249,228,'+(0.28+corePulse*0.3)+')'; ctx.lineWidth=2.4;
    ctx.beginPath();
    for(let t=0;t<1;t+=0.06){
      const a=t*3.4, rr=pr*(0.5+t*1.4);
      const x=Math.cos(a)*rr, y=Math.sin(a)*rr;
      t===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#050109'; ctx.beginPath(); ctx.arc(CX,CY,pr,0,TAU); ctx.fill();
  glow('rgba(255,60,166,.7)',22);
  ctx.strokeStyle='rgba(255,60,166,'+(0.6+corePulse*0.4)+')'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(CX,CY,pr,0,TAU); ctx.stroke();
  noGlow();
}

function frame(ts){
  if(!lastTs) lastTs=ts;
  let dt=(ts-lastTs)/1000; lastTs=ts;
  dt=Math.min(dt,0.05);
  update(dt); draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
